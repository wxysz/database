<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
<style>
.bg-yellow { fill: #f2ba1d; }
.bg-black { fill: #050505; }
.stroke-black { stroke: #050505; stroke-width: 8; fill: none; }
.text-serif { font-family: 'Times New Roman', Times, 'Georgia', serif; font-weight: bold; fill: #050505; }
.text-korean { font-family: 'Batang', 'Gungsuh', 'Myeongjo', serif; font-weight: bold; fill: #050505; }
</style>
​<defs>
<!-- Path for Top English Text -->
<path id="textArcTop" d="M 82 300 A 218 218 0 0 1 518 300" fill="none"/>
<!-- Path for Bottom Korean Text -->
<path id="textArcBottom" d="M 102 300 A 198 198 0 0 0 498 300" fill="none"/>
</defs>
​<!-- Outer Black Border -->
<circle cx="300" cy="300" r="295" class="bg-black" />
​<!-- Outer Yellow Ring -->
<circle cx="300" cy="300" r="290" class="bg-yellow" />
​<!-- Inner Black Border -->
<circle cx="300" cy="300" r="215" class="bg-black" stroke="#050505" stroke-width="4" />
​<!-- Top Text: Seoul Raiders -->
<text font-size="64" class="text-serif" letter-spacing="2">
<textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
Seoul Raiders
</textPath>
</text>
​<!-- Side Dots -->
<circle cx="95" cy="228" r="10" class="bg-black" />
<circle cx="505" cy="228" r="10" class="bg-black" />
​<!-- Bottom Text: 서울 레이더스 -->
<text font-size="52" class="text-korean" letter-spacing="4">
<textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
서 울   레 이 더 스
</textPath>
</text>
